<svg:g [attr.id]="parentGId+'_'+refName">
    <g rectangleG
       [attr.id]="parentGId+'_'+refName+'_ref'"
       [position]="middle"
       [color]="color"></g>
    <g text-area-svg
       [text]="refName"
       [x]="middle.x"
       [y]="middle.y"
       [w]="middle.w"
       [h]="middle.h"
    ></g>
    <g arrowElems
       [startGID]="parentGId"
       [startSuffix]="'_main'"
       [endGID]="parentGId+'_'+refName"
       [endSuffix]="'_ref'"
    >
    </g>
    <g referencable-box
       *ngFor="let child of children; let i = index"
   ></g>
</svg:g>

