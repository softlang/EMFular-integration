<h1>Detail-Editor</h1>
<h2>{{model.getEClass()}}</h2>
<div class="parent-choice">
    <label>Current Parent</label>
    <div *ngIf="!model.getParentReferencable()">
        <span class="alert-ref">No Parent</span>
    </div>
    <div class="ref-info" *ngIf="model.getParentReferencable()">
        <span class="ref-icon">🔗</span>
        <span class="ref-type">{{ model.getParentReferencable().getEClass() }}</span>
        <span class="ref-label">{{ IdHelper.getLabel(model.getParentReferencable()) }}</span>
    </div>
    <button (click)="chooseParent()">
        Set Parent
    </button>
</div>
<div class="attribute-list">
    <div class="attribute-row" *ngFor="let attr of attributes">
        <label>{{ attr.key }}</label>
        <input
                type="text"
                [(ngModel)]="$any(model)[attr.key]"
        />
    </div>
</div>
<h3>References</h3>
<div class="reference-list">
    <container-details
            *ngFor="let container of getChildren()"
            [container]="container"
            [isTree]="true"
            [modelService]="modelService"
            [detailsService]="detailsService"
    >
    </container-details>
    <container-details
        *ngFor="let container of getLinks()"
        [container]="container"
        [isTree]="false"
        [modelService]="modelService"
        [detailsService]="detailsService"
    >
    </container-details>
</div>
