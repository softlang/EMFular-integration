<emfular-basic-editor
    [svgwidth]="svgwidth"
    [svgheight]="svgheigth"
    [modelService]="modelService"
>
    <!-- Default sidebar -->
    <emfular-model-editing-bar
            sidebar
            [buttons]="sidebarButtons">
    </emfular-model-editing-bar>

    <!-- Default canvas content -->
    <g canvas
       referencable-box
       [referencable]="modelService.model"
       [position]="initialBBox"
       (chooseElement)="choose($event)">
    </g>
</emfular-basic-editor>
