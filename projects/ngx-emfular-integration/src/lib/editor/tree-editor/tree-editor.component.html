<div class="tree-editor" id="tree-editor">
    <emfular-file-level-bar
            [svg]="svgEl"
            [modelService]="modelService">
    </emfular-file-level-bar>
    <div class="editor-main">
        <!-- vertical model bar -->
        <emfular-model-editing-bar
                class="model-bar"
                [buttons]="sidebarButtons">
        </emfular-model-editing-bar>


            <!-- scrollable modeling canvas -->
        <div class="modeling-container">
            <svg #svg id="svg" class="canvas-svg">
                <g referencable-box
                   [referencable]="modelService.model"
                   [position]="initialBBox"
                >
                </g>
            </svg>
        </div>

    </div>

</div>
