<div class="model-editing-bar">
    <button *ngFor="let b of buttons" (click)="b.action()" [disabled]="b.disabled">
        <img
                *ngIf="b.icon"
                class="icon"
                [src]="b.icon"
                alt="Icon for {{b.label}}"
        />
        {{ b.label }}
    </button>
</div>
