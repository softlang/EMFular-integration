<div class="header">
    <h4>{{container.referenceName+":"}}</h4>
    <emfular-icon-button  *ngIf="!isTree"
                          [type]="IconButtonType.Add"
                          (pressed)="add()">
    </emfular-icon-button>
</div>

<div class="container-row"
     *ngFor="let elem of container.getAsList()">
    <div class="ref-info">
        <span class="ref-icon">🔗</span>
        <span class="ref-type">{{ elem.$getEClass() }}</span>
        <span class="ref-label">{{ elem.$label }}</span>
    </div>

    <div class="ref-actions">
        <emfular-icon-button
           [type]="IconButtonType.Inspect"
           (pressed)="open(elem)">
        </emfular-icon-button>
        <emfular-icon-button
                [type]="IconButtonType.Delete"
                (pressed)="remove(elem)">
        </emfular-icon-button>
    </div>
</div>
