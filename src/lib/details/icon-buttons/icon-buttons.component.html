<button
        type="button"
        class="icon-button"
        [class.delete-button]="type === IconButtonType.Delete"
        [class.edit-button]="type === IconButtonType.Edit || type === IconButtonType.Add"
        [class.neutral-button]="type === IconButtonType.Close || type === IconButtonType.Inspect"
        [style.width.px]="size"
        [style.height.px]="size"
        [disabled]="disabled"
        [attr.aria-label]="ariaLabel"
        [attr.title]="ariaLabel"
        (click)="onClick()">

    <svg viewBox="0 0 24 24" aria-hidden="true">
        @switch (type) {
            @case (IconButtonType.Add) {
                <svg:g>
                    <path d="M12 5v14M5 12h14"/>
                </svg:g>
            }
            @case (IconButtonType.Close) {
                <svg:g>
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg:g>
            }
            @case (IconButtonType.Delete) {
                <svg:g>
                    <path d="M3 6h18"/>
                    <path d="M8 6V4h8v2"/>
                    <path d="M19 6l-1 14H6L5 6"/>
                    <path d="M10 11v5M14 11v5"/>
                </svg:g>
            }
            @case (IconButtonType.Edit) {
                <g>
                    <path d="m15 5 4 4"/>
                    <path d="M4 20l4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16 4 20z"/>
                </g>
            }
            @case (IconButtonType.Inspect) {
                <g>
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                    <circle cx="12" cy="12" r="3"/>
                </g>
            }
        }
    </svg>
</button>
