<div class="detail-editor">
    <header class="detail-header">
        <div class="detail-title">
            <h1>Detail Editor</h1>
            <span class="detail-type">{{ model.$getEClass() }}</span>
        </div>

        <div class="header-actions">
            <emfular-icon-button
                    [type]="IconButtonType.Delete"
                    (pressed)="delete()"
            />
            <emfular-icon-button
                    [type]="IconButtonType.Close"
                    (pressed)="close()"
            />
        </div>
    </header>

    <section class="editor-section parent-choice">
        <h2>Parent</h2>
        <div class="parent-row">
            <div *ngIf="!model.$getEParent()" class="empty-ref">
                No Parent
            </div>
            <div *ngIf="model.$getEParent()" class="ref-info">
            <span class="ref-type">
                {{ model.$getEParent().$getEClass() }}
            </span>
                <span class="ref-label">
                {{ model.$getEParent().$label }}
            </span>
            </div>
            <emfular-icon-button
                    [type]="IconButtonType.Edit"
                    (pressed)="chooseParent()"
            />
        </div>
    </section>

    <section class="editor-section">
        <h2>Attributes</h2>
        <div class="attribute-list">
            <div class="attribute-row" *ngFor="let attr of attributes">
                <label [for]="'attr-' + attr.key">
                    {{ attr.key }}
                </label>
                <input
                        [id]="'attr-' + attr.key"
                        type="text"
                        [(ngModel)]="$any(model)[attr.key]" />
            </div>
        </div>
    </section>

    <section class="editor-section">
        <h2>References</h2>
        <div class="reference-list">
            <emfular-reference-details
                    *ngFor="let container of model.$treeChildren"
                    [container]="container"
                    [isTree]="true"
                    [modelService]="modelService"
                    [detailsService]="detailsService">
            </emfular-reference-details>
            <emfular-reference-details
                    *ngFor="let container of model.$otherLinks"
                    [container]="container"
                    [isTree]="false"
                    [modelService]="modelService"
                    [detailsService]="detailsService">
            </emfular-reference-details>
        </div>
    </section>
</div>
