<svg:g [attr.id]="referencable.$gId">

    <!-- main element -->
    <g
        [id]="referencable.$gId + '_main'"
        [dragPosition]="position"
        (elemReallyClicked)="choose(referencable)"
    >
        <ng-container
             [ngTemplateOutlet]="rectangleWithText"
             [ngTemplateOutletContext]="{
                id: referencable.$gId + '_main',
                position: position,
                color: color,
                text: referencable.$label
            }"
        ></ng-container>
        <g text-area-svg
           [id]="referencable.$gId  + '_toggle'"
           [text]="isExpanded ? '▲' : '▼'"
           [x]="createBoxInLastPart(position).x"
           [y]="createBoxInLastPart(position).y"
           [w]="25"
           [h]="25"
           (click)="toggleMainExpand()"
        ></g>
    </g>

    @if (isExpanded) {
        <!-- containers -->
        @for (container of references; track container.id; let i = $index) {

            <!-- references -->
            <g
                    (click)="chooseRef(container.self)"
                    [id]="container.id + '_ref'"
            >
                <ng-container
                        [ngTemplateOutlet]="rectangleWithText"
                        [ngTemplateOutletContext]="{
                   id: container.id + '_ref',
                   position: container.position,
                   color: '#ede679',
                   text: container.referenceName
               }"
                ></ng-container>
            </g>
            <g text-area-svg
               [id]="container.id + '_toggle'"
               [text]="container.expanded ? '▲' : '▼'"
               [x]="createBoxInLastPart(container.position).x"
               [y]="createBoxInLastPart(container.position).y"
               [w]="25"
               [h]="25"
               (click)="container.expanded = !container.expanded"
            ></g>

            <!-- arrow from main box to reference -->
            <g arrow-elements
               [startGID]="referencable.$gId+'_main'"
               [endGID]="container.id+'_ref'"
            ></g>


        <!-- recursive elements under the reference-->
            @if (container.expanded) {
                <!-- real children inside this reference -->
                @let realChildren = container.self.getAsList();

                @for (elem of realChildren; track elem.$gId; let j = $index) {

                    @let elemBox = computeChildBBox(
                        j,
                        realChildren.length,
                        container.position
                    );
                    <g referencable-box
                       (chooseElement)="choose($event)"
                       [referencable]="elem"
                       [position]="elemBox"
                    >
                    </g>
                    <!-- arrow from reference to child box -->
                    <g arrow-elements
                       [startGID]="container.id+'_ref'"
                       [endGID]="elem.$gId+'_main'"
                    ></g>
                }

            }
        }
    }
</svg:g>


<ng-template #rectangleWithText
             let-id="id"
             let-position="position"
             let-color="color"
             let-text="text">

    <svg:g rectangleG
       [id]="id + '_rect'"
       [position]="position"
       [color]="color">
    </svg:g>
    <svg:g text-area-svg
       [id]="id + '_text'"
       [x]="position.x"
       [y]="position.y"
       [w]="position.w"
       [h]="position.h"
       [text]="text">
    </svg:g>
</ng-template>