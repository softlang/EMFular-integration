<svg:g [attr.id]="referencable.$gId">

    <g
        (click)="choose(referencable)"
        [id]="referencable.$gId + '_main'"
    >
        <ng-container
             [ngTemplateOutlet]="rectangleWithText"
             [ngTemplateOutletContext]="{
                id: referencable.$gId + '_main',
                position: position,
                color: color,
                text: IdHelper.getLabel(referencable)
            }"
        ></ng-container>
    </g>

    <!-- containers -->
    @for (container of referencable.$treeChildren;
        track referencable.$gId + '_' + container.referenceName
            ; let i = $index) {

        @let containerKey = referencable.$gId + '_' + container.referenceName;
        @let containerAnchorBox = computeChildBBox(
            i,
            referencable.$treeChildren.length,
            position
        );

        <!-- reference box -->
        <g
            (click)="chooseRef(container)"
            [id]="containerKey + '_ref'"
        >
            <ng-container
               [ngTemplateOutlet]="rectangleWithText"
               [ngTemplateOutletContext]="{
                   id: containerKey + '_ref',
                   position: containerAnchorBox,
                   color: '#ede679',
                   text: container.referenceName
               }"
            ></ng-container>
        </g>
        <g text-area-svg
           [id]="containerKey + '_toggle'"
           [text]="isExpandedArray[i]?'◊':'V'"
           [x]="createBoxInLastPart(containerAnchorBox).x"
           [y]="createBoxInLastPart(containerAnchorBox).y"
           [w]="createBoxInLastPart(containerAnchorBox).w"
           [h]="createBoxInLastPart(containerAnchorBox).h"
           (click)="toggleExpand(i)"
        ></g>


        <!-- arrow from main box to reference -->
        <g arrow-elements
           [startGID]="referencable.$gId+'_main'"
           [endGID]="containerKey+'_ref'"
        ></g>

        @if (isExpandedArray[i]) {
            <!-- real children inside this reference -->
            @let realChildren = GraphicalHelper.getAsList(container);

            @for (elem of realChildren; track elem.$gId; let j = $index) {

                @let elemBox = computeChildBBox(
                    j,
                    realChildren.length,
                    containerAnchorBox
                );
                <g referencable-box
                   (chooseElement)="choose($event)"
                   [referencable]="elem"
                   [position]="elemBox"
                >
                </g>
                <!-- arrow from reference to child box -->
                <g arrow-elements
                   [startGID]="containerKey+'_ref'"
                   [endGID]="elem.$gId+'_main'"
                ></g>
            }

        }
    }
</svg:g>


<ng-template #rectangleWithText
             let-id="id"
             let-position="position"
             let-color="color"
             let-text="text">

    <svg:g rectangleG
       [id]="id + '_rect'"
       [position]="position"
       [color]="color">
    </svg:g>
    <svg:g text-area-svg
       [id]="id + '_text'"
       [x]="position.x"
       [y]="position.y"
       [w]="position.w"
       [h]="position.h"
       [text]="text">
    </svg:g>
</ng-template>